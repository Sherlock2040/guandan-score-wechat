<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="light">
  <title>掼蛋计分</title>
  <style>
    :root {
      --felt: #174d3b;
      --felt-dark: #0b2a21;
      --paper: #fff9ed;
      --paper-soft: #f5ecd9;
      --ink: #1f241f;
      --muted: #6e766f;
      --line: rgba(31, 36, 31, 0.13);
      --red: #b92f35;
      --green: #128057;
      --gold: #c78924;
      --blue: #245a89;
      --shadow: 0 18px 44px rgba(6, 31, 23, 0.2);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(199, 137, 36, 0.22), transparent 34%),
        linear-gradient(145deg, var(--felt-dark), var(--felt) 50%, #12372c);
    }

    body {
      min-height: 100vh;
      padding:
        max(14px, env(safe-area-inset-top))
        12px
        max(18px, env(safe-area-inset-bottom));
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      color: var(--ink);
      background: var(--paper-soft);
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    input,
    textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--ink);
      background: #fff;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
      line-height: 1.55;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(185, 47, 53, 0.52);
      box-shadow: 0 0 0 3px rgba(185, 47, 53, 0.12);
    }

    .app {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--paper);
      padding: 8px 2px 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mark {
      width: 46px;
      height: 46px;
      position: relative;
      flex: 0 0 auto;
    }

    .card-mark {
      position: absolute;
      width: 28px;
      height: 38px;
      border-radius: 5px;
      background: var(--paper);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.24);
    }

    .card-mark::after {
      content: attr(data-suit);
      position: absolute;
      inset: 4px;
      color: var(--red);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 900;
    }

    .card-mark:first-child {
      left: 5px;
      top: 7px;
      transform: rotate(-13deg);
    }

    .card-mark:last-child {
      right: 4px;
      top: 3px;
      transform: rotate(10deg);
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-family: "Songti SC", "STSong", serif;
      font-size: 28px;
      line-height: 1;
    }

    .sub {
      margin-top: 5px;
      color: rgba(255, 249, 237, 0.72);
      font-size: 12px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .icon-btn {
      width: 44px;
      padding: 0;
      color: var(--paper);
      background: rgba(255, 249, 237, 0.12);
      border: 1px solid rgba(255, 249, 237, 0.22);
    }

    .panel {
      margin-bottom: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 249, 237, 0.4);
      border-radius: 8px;
      background: rgba(255, 249, 237, 0.96);
      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 {
      font-size: 16px;
    }

    .panel-body {
      padding: 15px;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .primary {
      color: #fff;
      background: var(--red);
    }

    .success {
      color: #fff;
      background: var(--green);
    }

    .blue {
      color: #fff;
      background: var(--blue);
    }

    .danger {
      color: #fff;
      background: var(--red);
    }

    .ghost {
      color: var(--felt-dark);
      background: #fff;
      border: 1px solid var(--line);
    }

    .hidden {
      display: none !important;
    }

    .setup-list {
      display: grid;
      gap: 8px;
    }

    .setup-row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      align-items: center;
      gap: 9px;
    }

    .num {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #fff;
      background: var(--felt);
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 900;
      font-size: 13px;
    }

    .bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 12px;
    }

    .bar .grow {
      flex: 1 1 auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .stat {
      min-height: 62px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      display: block;
      margin-top: 3px;
      color: var(--felt-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      line-height: 1;
    }

    .quick-add {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-top: 12px;
    }

    .seat-list {
      display: grid;
      gap: 8px;
    }

    .score-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(150px, 0.72fr);
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .score-line strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
    }

    .score-line input {
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 900;
    }

    .score-editor {
      display: grid;
      gap: 7px;
    }

    .score-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .score-tools button {
      min-height: 36px;
      padding: 0 8px;
      font-size: 14px;
    }

    .bench {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      color: var(--muted);
      background: var(--paper-soft);
      font-size: 13px;
      line-height: 1.5;
    }

    .error {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      color: #8c1e23;
      background: #f9dedd;
      font-size: 13px;
      line-height: 1.5;
    }

    .error.show {
      display: block;
    }

    .rotation {
      border-color: rgba(199, 137, 36, 0.55);
      background: #fff7df;
    }

    .choice-list {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .choice {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      min-height: 46px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .choice input {
      width: 20px;
      height: 20px;
      min-height: 20px;
      padding: 0;
    }

    .choice strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .choice small {
      color: var(--muted);
      font-size: 12px;
    }

    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      background: #fff;
      font-size: 13px;
    }

    th,
    td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      text-align: center;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      background: #f8f1e3;
      font-size: 12px;
      font-weight: 800;
    }

    td:first-child,
    th:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      background: inherit;
      text-align: left;
    }

    .total {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      font-weight: 900;
      color: var(--felt);
    }

    .pos {
      color: var(--green);
      font-weight: 800;
    }

    .neg {
      color: var(--red);
      font-weight: 800;
    }

    .skip {
      color: #bbb;
    }

    .out-btn {
      min-height: 32px;
      padding: 0 8px;
      color: #8c1e23;
      background: #f9dedd;
      font-size: 12px;
    }

    .rank-list {
      display: grid;
      gap: 8px;
    }

    .rank {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      min-height: 48px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .badge {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #fff;
      background: #6f766f;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 900;
    }

    .badge.gold {
      background: #d29125;
    }

    .badge.silver {
      background: #89909a;
    }

    .badge.bronze {
      background: #b86930;
    }

    .rank-name {
      min-width: 0;
    }

    .rank-name strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-name span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .rank-score {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 900;
      color: var(--felt);
    }

    .export-card textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 20;
      min-width: 160px;
      max-width: calc(100vw - 28px);
      transform: translate(-50%, 14px);
      padding: 10px 14px;
      border-radius: 8px;
      color: #fff;
      background: rgba(11, 42, 33, 0.94);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 560px) {
      body {
        padding-left: 10px;
        padding-right: 10px;
      }

      .top {
        align-items: flex-start;
      }

      h1 {
        font-size: 26px;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .score-line {
        grid-template-columns: minmax(0, 1fr) minmax(138px, 0.8fr);
      }

      .bar button {
        flex: 1 1 auto;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <div class="card-mark" data-suit="♥"></div>
          <div class="card-mark" data-suit="♠"></div>
        </div>
        <div>
          <h1>V5友谊的大船/h1>
          <div class="sub">喝茶第一 · 吃饭第二 · 掼蛋第三</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" type="button" onclick="openExport()" title="导出">导出</button>
      </div>
    </header>

    <section class="panel" id="setupBox">
      <div class="panel-head">
        <h2>选手</h2>
        <span class="muted">4-16 人</span>
      </div>
      <div class="panel-body">
        <div class="setup-list" id="setupInputs"></div>
        <div class="bar">
          <button type="button" onclick="addSetupSeat()">＋</button>
          <button type="button" onclick="removeSetupSeat()">－</button>
          <div class="grow"></div>
          <button class="primary" type="button" onclick="startGame()">开始</button>
        </div>
      </div>
    </section>

    <section class="panel hidden" id="gameBox">
      <div class="panel-head">
        <h2>本轮</h2>
        <button class="ghost" type="button" onclick="resetGame()">重置</button>
      </div>
      <div class="panel-body">
        <div class="stats">
          <div class="stat"><span>轮次</span><strong id="roundNumber">1</strong></div>
          <div class="stat"><span>上桌</span><strong id="tableCount">4</strong></div>
          <div class="stat"><span>候补</span><strong id="benchCount">0</strong></div>
          <div class="stat"><span>总人数</span><strong id="playerCount">4</strong></div>
          <div class="stat"><span>最高</span><strong id="maxScore">0</strong></div>
          <div class="stat"><span>最低</span><strong id="minScore">0</strong></div>
        </div>

        <div class="quick-add">
          <input id="newPlayerName" type="text" maxlength="12" placeholder="增加新选手">
          <button class="success" type="button" onclick="addPlayerDuringGame()">增加</button>
        </div>
      </div>
    </section>

    <section class="panel hidden" id="scoreBox">
      <div class="panel-head">
        <h2>得分</h2>
        <span class="muted">合计必须为 0</span>
      </div>
      <div class="panel-body">
        <div class="seat-list" id="seatList"></div>
        <div class="bench" id="benchInfo"></div>
        <div class="bar">
          <button class="success" type="button" onclick="submitRound()">提交</button>
          <button type="button" onclick="undoRound()">撤销</button>
          <button type="button" onclick="clearScoreInputs()">清空</button>
        </div>
        <div class="error" id="errorBox"></div>
      </div>
    </section>

    <section class="panel rotation hidden" id="rotationBox">
      <div class="panel-head">
        <h2>轮换</h2>
        <span class="muted">最多下 2 人</span>
      </div>
      <div class="panel-body">
        <div class="muted">下桌</div>
        <div class="choice-list" id="outList"></div>
        <div id="inBlock" class="hidden">
          <div class="muted" style="margin-top:12px;">上桌</div>
          <div class="choice-list" id="inList"></div>
        </div>
        <div class="bar">
          <button class="primary" id="confirmRotationBtn" type="button" onclick="confirmRotation()">确认</button>
          <button type="button" onclick="skipRotation()">跳过</button>
          <button type="button" onclick="cancelPendingRound()">取消</button>
        </div>
      </div>
    </section>

    <section class="panel hidden" id="boardBox">
      <div class="panel-head">
        <h2>计分板</h2>
        <span class="muted" id="saveStateText">已本地保存</span>
      </div>
      <div class="panel-body">
        <div class="table-wrap">
          <table id="scoreBoard">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="panel hidden" id="rankBox">
      <div class="panel-head">
        <h2>排名</h2>
        <span class="muted">按总分排序</span>
      </div>
      <div class="panel-body">
        <div class="rank-list" id="rankList"></div>
      </div>
    </section>

    <section class="panel export-card hidden" id="exportBox">
      <div class="panel-head">
        <h2>导出</h2>
        <button class="ghost" type="button" onclick="closeExport()">关闭</button>
      </div>
      <div class="panel-body">
        <textarea id="exportText" readonly></textarea>
        <div class="bar">
          <button class="primary" type="button" onclick="copyExportText()">复制</button>
          <button class="blue" type="button" onclick="downloadCsv()">下载 CSV</button>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    var STORAGE_KEY = "guandan-score-wechat-v1";
    var MAX_PLAYERS = 16;
    var MIN_PLAYERS = 4;
    var state = {
      setupCount: 4,
      names: [],
      scores: [],
      table: [],
      bench: [],
      rounds: [],
      pendingRound: null
    };

    function byId(id) {
      return document.getElementById(id);
    }

    function isWeChat() {
      return /MicroMessenger/i.test(navigator.userAgent || "");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatScore(value) {
      var n = Math.round(Number(value || 0) * 100) / 100;
      return n > 0 ? "+" + n : String(n);
    }

    function activePlayerIds() {
      return state.table.concat(state.bench);
    }

    function isActive(pid) {
      return activePlayerIds().indexOf(pid) >= 0;
    }

    function sanitizeState(value) {
      if (!value || !Array.isArray(value.names) || !Array.isArray(value.scores)) return null;
      var count = value.names.length;
      if (!count || value.scores.length !== count) return null;
      return {
        setupCount: Math.max(MIN_PLAYERS, Math.min(MAX_PLAYERS, Number(value.setupCount) || count || MIN_PLAYERS)),
        names: value.names.map(function (name, index) {
          return String(name || ("选手" + (index + 1))).trim().slice(0, 12);
        }),
        scores: value.scores.map(function (score) {
          var n = Number(score);
          return Number.isFinite(n) ? n : 0;
        }),
        table: Array.isArray(value.table) ? value.table.filter(function (pid) {
          return Number.isInteger(pid) && pid >= 0 && pid < count;
        }) : [],
        bench: Array.isArray(value.bench) ? value.bench.filter(function (pid) {
          return Number.isInteger(pid) && pid >= 0 && pid < count;
        }) : [],
        rounds: Array.isArray(value.rounds) ? value.rounds : [],
        pendingRound: value.pendingRound || null
      };
    }

    function loadState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        var saved = raw ? sanitizeState(JSON.parse(raw)) : null;
        if (saved) state = saved;
      } catch (error) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        byId("saveStateText").textContent = isWeChat() ? "微信内已保存" : "已本地保存";
      } catch (error) {
        byId("saveStateText").textContent = "保存受限";
      }
    }

    function hasGame() {
      return state.names.length >= MIN_PLAYERS && state.scores.length === state.names.length && state.table.length > 0;
    }

    function render() {
      renderSetup();
      if (hasGame()) {
        byId("setupBox").classList.add("hidden");
        byId("gameBox").classList.remove("hidden");
        byId("scoreBox").classList.remove("hidden");
        byId("boardBox").classList.remove("hidden");
        byId("rankBox").classList.remove("hidden");
        renderGame();
      } else {
        byId("setupBox").classList.remove("hidden");
        byId("gameBox").classList.add("hidden");
        byId("scoreBox").classList.add("hidden");
        byId("boardBox").classList.add("hidden");
        byId("rankBox").classList.add("hidden");
        byId("rotationBox").classList.add("hidden");
      }
      saveState();
    }

    function renderSetup() {
      var box = byId("setupInputs");
      box.innerHTML = "";
      for (var i = 0; i < state.setupCount; i += 1) {
        var name = state.names[i] || "";
        box.innerHTML +=
          '<div class="setup-row">' +
          '<div class="num">' + (i + 1) + '</div>' +
          '<input type="text" maxlength="12" id="setupPlayer' + i + '" placeholder="选手' + (i + 1) + '" value="' + escapeHtml(name) + '">' +
          '</div>';
      }
    }

    function collectSetupNames() {
      var names = [];
      for (var i = 0; i < state.setupCount; i += 1) {
        var input = byId("setupPlayer" + i);
        names.push((input && input.value.trim()) || ("选手" + (i + 1)));
      }
      return names;
    }

    function addSetupSeat() {
      state.names = collectSetupNames();
      if (state.setupCount >= MAX_PLAYERS) {
        showToast("最多 16 人");
        return;
      }
      state.setupCount += 1;
      renderSetup();
    }

    function removeSetupSeat() {
      state.names = collectSetupNames();
      if (state.setupCount <= MIN_PLAYERS) {
        showToast("至少 4 人");
        return;
      }
      state.setupCount -= 1;
      state.names = state.names.slice(0, state.setupCount);
      renderSetup();
    }

    function startGame() {
      var names = collectSetupNames().map(function (name) {
        return name.trim().slice(0, 12);
      });
      var seen = {};
      for (var i = 0; i < names.length; i += 1) {
        if (seen[names[i]]) {
          showToast("姓名不能重复");
          return;
        }
        seen[names[i]] = true;
      }
      var order = [];
      for (var j = 0; j < names.length; j += 1) order.push(j);
      order.sort(function () {
        return Math.random() - 0.5;
      });
      state.names = names;
      state.scores = names.map(function () { return 0; });
      state.rounds = [];
      state.table = order.slice(0, 4);
      state.bench = order.slice(4);
      state.pendingRound = null;
      byId("exportBox").classList.add("hidden");
      render();
      showToast("已开始");
    }

    function renderGame() {
      byId("roundNumber").textContent = state.rounds.length + 1;
      byId("tableCount").textContent = state.table.length;
      byId("benchCount").textContent = state.bench.length;
      byId("playerCount").textContent = state.names.length;
      byId("maxScore").textContent = state.scores.length ? Math.max.apply(null, state.scores) : 0;
      byId("minScore").textContent = state.scores.length ? Math.min.apply(null, state.scores) : 0;
      renderSeats();
      renderRotation();
      renderBoard();
      renderRanks();
    }

    function renderSeats() {
      var seats = byId("seatList");
      seats.innerHTML = "";
      if (!state.table.length) {
        seats.innerHTML = '<div class="bench">当前没有上桌选手</div>';
      }
      state.table.forEach(function (pid) {
        seats.innerHTML +=
          '<div class="score-line">' +
          '<strong>' + escapeHtml(state.names[pid]) + '</strong>' +
          '<div class="score-editor">' +
          '<input type="text" inputmode="text" enterkeyhint="done" autocomplete="off" id="scoreInput' + pid + '" placeholder="可输入 -10" oninput="normalizeScoreInput(' + pid + ')">' +
          '<div class="score-tools">' +
          '<button type="button" onclick="toggleScoreSign(' + pid + ')" title="切换正负">±</button>' +
          '<button type="button" onclick="resetScoreInput(' + pid + ')" title="清空分数">清</button>' +
          '</div>' +
          '</div>' +
          '</div>';
      });

      var benchNames = state.bench.map(function (pid) {
        return state.names[pid];
      });
      byId("benchInfo").textContent = benchNames.length ? ("候补：" + benchNames.join("、")) : "暂无候补";
      hideError();
    }

    function normalizeScoreText(value) {
      return String(value || "")
        .trim()
        .replace(/[\u2212\uff0d]/g, "-")
        .replace(/\s+/g, "");
    }

    function normalizeScoreInput(pid) {
      var input = byId("scoreInput" + pid);
      if (!input) return;
      var normalized = normalizeScoreText(input.value);
      if (input.value !== normalized) input.value = normalized;
      hideError();
    }

    function toggleScoreSign(pid) {
      var input = byId("scoreInput" + pid);
      if (!input) return;
      var normalized = normalizeScoreText(input.value);
      if (!normalized || normalized === "0") {
        input.value = "-";
      } else if (normalized.charAt(0) === "-") {
        input.value = normalized.slice(1);
      } else {
        input.value = "-" + normalized.replace(/^\+/, "");
      }
      input.focus();
      hideError();
    }

    function resetScoreInput(pid) {
      var input = byId("scoreInput" + pid);
      if (!input) return;
      input.value = "";
      input.focus();
      hideError();
    }

    function clearScoreInputs() {
      state.table.forEach(function (pid) {
        var input = byId("scoreInput" + pid);
        if (input) input.value = "";
      });
      hideError();
    }

    function addPlayerDuringGame() {
      if (state.pendingRound) {
        showToast("请先完成本轮轮换");
        return;
      }
      if (state.names.length >= MAX_PLAYERS) {
        showToast("最多 16 人");
        return;
      }
      var input = byId("newPlayerName");
      var name = input.value.trim().slice(0, 12);
      if (!name) {
        showToast("请输入姓名");
        return;
      }
      if (state.names.indexOf(name) >= 0) {
        showToast("姓名已存在");
        return;
      }
      var pid = state.names.length;
      state.names.push(name);
      state.scores.push(0);
      state.bench.push(pid);
      input.value = "";
      render();
      showToast(name + " 已加入候补");
    }

    function removePlayer(pid) {
      if (state.pendingRound) {
        showToast("请先完成本轮轮换");
        return;
      }
      if (!isActive(pid)) return;
      if (!confirm("确认 " + state.names[pid] + " 退出比赛？")) return;
      var tableIndex = state.table.indexOf(pid);
      if (tableIndex >= 0) state.table.splice(tableIndex, 1);
      var benchIndex = state.bench.indexOf(pid);
      if (benchIndex >= 0) state.bench.splice(benchIndex, 1);
      while (state.table.length < 4 && state.bench.length > 0) {
        state.table.push(state.bench.shift());
      }
      render();
      showToast("已退出");
    }

    function submitRound() {
      if (state.pendingRound) {
        showToast("请先确认轮换");
        return;
      }
      if (!state.table.length) {
        showToast("当前没有上桌选手");
        return;
      }
      var vals = [];
      for (var i = 0; i < state.table.length; i += 1) {
        var pid = state.table[i];
        var input = byId("scoreInput" + pid);
        var raw = input ? normalizeScoreText(input.value) : "";
        if (raw === "") {
          showError("请输入所有上桌选手得分");
          return;
        }
        if (raw === "-" || raw === "+" || raw === "." || raw === "-." || raw === "+.") {
          showError("得分必须是完整数字");
          return;
        }
        var score = Number(raw);
        if (!Number.isFinite(score)) {
          showError("得分必须是数字，例如 10 或 -10");
          return;
        }
        if (input) input.value = raw;
        vals.push({ pid: pid, score: score });
      }
      var total = vals.reduce(function (sum, item) {
        return sum + item.score;
      }, 0);
      total = Math.round(total * 1000) / 1000;
      if (Math.abs(total) > 0.001) {
        showError("上桌得分合计必须为 0，当前为 " + total);
        return;
      }
      var scores = {};
      vals.forEach(function (item) {
        scores[item.pid] = item.score;
      });
      state.pendingRound = {
        number: state.rounds.length + 1,
        createdAt: new Date().toISOString(),
        tableBefore: state.table.slice(),
        benchBefore: state.bench.slice(),
        scores: scores,
        vals: vals
      };
      hideError();
      renderGame();
      showToast("请选择轮换");
    }

    function renderRotation() {
      var box = byId("rotationBox");
      if (!state.pendingRound) {
        box.classList.add("hidden");
        return;
      }
      box.classList.remove("hidden");
      var out = byId("outList");
      out.innerHTML = "";
      state.pendingRound.vals.forEach(function (item) {
        out.innerHTML +=
          '<label class="choice">' +
          '<input class="outChoice" type="checkbox" value="' + item.pid + '" onchange="syncRotationRules()">' +
          '<strong>' + escapeHtml(state.names[item.pid]) + '</strong>' +
          '<small>' + formatScore(item.score) + '</small>' +
          '</label>';
      });

      var manualIn = state.names.length > 6 && state.bench.length >= 2;
      byId("inBlock").classList.toggle("hidden", !manualIn);
      var input = byId("inList");
      input.innerHTML = "";
      if (manualIn) {
        state.bench.forEach(function (pid) {
          input.innerHTML +=
            '<label class="choice">' +
            '<input class="inChoice" type="checkbox" value="' + pid + '" onchange="syncRotationRules()">' +
            '<strong>' + escapeHtml(state.names[pid]) + '</strong>' +
            '<small>候补</small>' +
            '</label>';
        });
      }
      syncRotationRules();
    }

    function checkedValues(selector) {
      return Array.prototype.slice.call(document.querySelectorAll(selector))
        .filter(function (input) { return input.checked && !input.disabled; })
        .map(function (input) { return Number(input.value); });
    }

    function syncRotationRules() {
      if (!state.pendingRound) return;
      var out = checkedValues(".outChoice");
      var inPlayers = checkedValues(".inChoice");
      var manualIn = state.names.length > 6 && state.bench.length >= 2;
      byId("confirmRotationBtn").disabled = out.length > 2 || (manualIn && inPlayers.length !== out.length);
    }

    function commitPendingRound() {
      if (!state.pendingRound) return;
      Object.keys(state.pendingRound.scores).forEach(function (pid) {
        state.scores[Number(pid)] += state.pendingRound.scores[pid];
      });
      state.rounds.push({
        number: state.pendingRound.number,
        createdAt: state.pendingRound.createdAt,
        tableBefore: state.pendingRound.tableBefore.slice(),
        benchBefore: state.pendingRound.benchBefore.slice(),
        scores: Object.assign({}, state.pendingRound.scores)
      });
    }

    function confirmRotation() {
      if (!state.pendingRound) return;
      var out = checkedValues(".outChoice");
      if (out.length > 2) {
        showToast("最多下 2 人");
        return;
      }

      var incoming = [];
      var manualIn = state.names.length > 6 && state.bench.length >= 2;
      if (out.length > 0) {
        if (manualIn) {
          incoming = checkedValues(".inChoice");
          if (incoming.length !== out.length) {
            showToast("上下人数要一致");
            return;
          }
        } else {
          if (out.length > state.bench.length) {
            showToast("候补不足，无法轮换");
            return;
          }
          for (var i = 0; i < out.length && state.bench.length > 0; i += 1) {
            incoming.push(state.bench.shift());
          }
        }
      }

      var tableBefore = state.table.slice();
      if (manualIn) {
        incoming.forEach(function (pid) {
          var index = state.bench.indexOf(pid);
          if (index >= 0) state.bench.splice(index, 1);
        });
      }
      out.forEach(function (pid) {
        if (state.bench.indexOf(pid) < 0) state.bench.push(pid);
      });

      var nextTable = tableBefore.slice();
      var incomingIndex = 0;
      for (var t = 0; t < nextTable.length; t += 1) {
        if (out.indexOf(nextTable[t]) >= 0 && incoming[incomingIndex] !== undefined) {
          nextTable[t] = incoming[incomingIndex];
          incomingIndex += 1;
        }
      }
      state.table = nextTable.filter(function (pid) {
        return out.indexOf(pid) < 0 || incoming.indexOf(pid) >= 0;
      });
      while (state.table.length < 4 && state.bench.length > 0) {
        state.table.push(state.bench.shift());
      }

      commitPendingRound();
      state.pendingRound = null;
      clearScoreInputs();
      render();
    }

    function skipRotation() {
      if (!state.pendingRound) return;
      commitPendingRound();
      state.pendingRound = null;
      clearScoreInputs();
      render();
    }

    function cancelPendingRound() {
      state.pendingRound = null;
      renderGame();
      showToast("已取消");
    }

    function undoRound() {
      if (state.pendingRound) {
        cancelPendingRound();
        return;
      }
      if (!state.rounds.length) {
        showToast("暂无记录");
        return;
      }
      var last = state.rounds.pop();
      state.table = last.tableBefore.slice();
      state.bench = last.benchBefore.slice();
      Object.keys(last.scores).forEach(function (pid) {
        state.scores[Number(pid)] -= last.scores[pid];
      });
      render();
      showToast("已撤销");
    }

    function renderBoard() {
      var thead = byId("scoreBoard").querySelector("thead");
      var tbody = byId("scoreBoard").querySelector("tbody");
      var head = "<tr><th>选手</th>";
      for (var i = 0; i < state.rounds.length; i += 1) head += "<th>" + (i + 1) + "</th>";
      head += "<th>总计</th><th>状态</th></tr>";
      thead.innerHTML = head;

      var body = "";
      for (var pid = 0; pid < state.names.length; pid += 1) {
        var active = isActive(pid);
        body += '<tr><td><strong>' + escapeHtml(state.names[pid]) + '</strong></td>';
        for (var ri = 0; ri < state.rounds.length; ri += 1) {
          var score = state.rounds[ri].scores[pid];
          if (score === undefined) {
            body += '<td class="skip">-</td>';
          } else {
            body += '<td class="' + (score > 0 ? "pos" : score < 0 ? "neg" : "") + '">' + formatScore(score) + '</td>';
          }
        }
        var total = state.scores[pid] || 0;
        body += '<td class="total ' + (total > 0 ? "pos" : total < 0 ? "neg" : "") + '">' + formatScore(total) + '</td>';
        body += active
          ? '<td><button class="out-btn" type="button" onclick="removePlayer(' + pid + ')">退出</button></td>'
          : '<td class="skip">已退出</td>';
        body += '</tr>';
      }
      tbody.innerHTML = body;
    }

    function renderRanks() {
      var list = byId("rankList");
      var players = state.names.map(function (name, pid) {
        var played = state.rounds.filter(function (round) {
          return round.scores[pid] !== undefined;
        }).length;
        return { name: name, pid: pid, score: state.scores[pid] || 0, played: played, active: isActive(pid) };
      });
      players.sort(function (a, b) {
        return b.score - a.score;
      });
      list.innerHTML = "";
      players.forEach(function (player, index) {
        var badge = index === 0 ? "gold" : index === 1 ? "silver" : index === 2 ? "bronze" : "";
        list.innerHTML +=
          '<div class="rank">' +
          '<div class="badge ' + badge + '">' + (index + 1) + '</div>' +
          '<div class="rank-name"><strong>' + escapeHtml(player.name) + '</strong><span>上桌 ' + player.played + ' 轮' + (player.active ? "" : " · 已退出") + '</span></div>' +
          '<div class="rank-score ' + (player.score > 0 ? "pos" : player.score < 0 ? "neg" : "") + '">' + formatScore(player.score) + '</div>' +
          '</div>';
      });
    }

    function buildCsv() {
      var lines = [];
      var header = ["选手"];
      for (var i = 0; i < state.rounds.length; i += 1) header.push(String(i + 1));
      header.push("总计");
      lines.push(header.join(","));
      for (var pid = 0; pid < state.names.length; pid += 1) {
        var row = [state.names[pid]];
        for (var ri = 0; ri < state.rounds.length; ri += 1) {
          var score = state.rounds[ri].scores[pid];
          row.push(score === undefined ? "-" : String(score));
        }
        row.push(String(state.scores[pid] || 0));
        lines.push(row.map(function (cell) {
          return '"' + String(cell).replace(/"/g, '""') + '"';
        }).join(","));
      }
      return lines.join("\n");
    }

    function openExport() {
      byId("exportBox").classList.remove("hidden");
      byId("exportText").value = buildCsv();
      byId("exportBox").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function closeExport() {
      byId("exportBox").classList.add("hidden");
    }

    function copyExportText() {
      var text = byId("exportText");
      text.focus();
      text.select();
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text.value).then(function () {
          showToast("已复制");
        }).catch(function () {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(textarea) {
      try {
        var ok = document.execCommand("copy");
        showToast(ok ? "已复制" : "请手动复制");
      } catch (error) {
        showToast("请手动复制");
      }
    }

    function downloadCsv() {
      var blob = new Blob(["\ufeff" + buildCsv()], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = "掼蛋计分.csv";
      link.click();
      URL.revokeObjectURL(url);
      if (isWeChat()) showToast("微信内建议使用复制");
    }

    function resetGame() {
      if (!confirm("确认重置当前牌局？")) return;
      state = {
        setupCount: 4,
        names: [],
        scores: [],
        table: [],
        bench: [],
        rounds: [],
        pendingRound: null
      };
      localStorage.removeItem(STORAGE_KEY);
      byId("exportBox").classList.add("hidden");
      render();
    }

    function showError(message) {
      var box = byId("errorBox");
      box.textContent = message;
      box.classList.add("show");
    }

    function hideError() {
      var box = byId("errorBox");
      box.textContent = "";
      box.classList.remove("show");
    }

    var toastTimer;
    function showToast(message) {
      clearTimeout(toastTimer);
      var toast = byId("toast");
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(function () {
        toast.classList.remove("show");
      }, 1600);
    }

    loadState();
    render();
  </script>
</body>
</html>
